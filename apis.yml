name: RenoFi
description: >-
  RenoFi is a home-renovation financing platform that partners with credit
  unions and lenders to offer renovation-specific loans underwritten against a
  home's projected after-renovation value (ARV) rather than its current equity,
  letting homeowners borrow significantly more without refinancing their first
  mortgage. RenoFi is not itself a lender: it originates and prepares
  applications, performs renovation underwriting, and connects homeowners,
  contractors, realtors, and credit-union partners to its lending network for
  RenoFi Home Equity Loans and HELOCs. The company maintains a public GitHub
  organization of open-source Ruby infrastructure libraries (GraphQL and
  Salesforce tooling) but publishes no public product API, OpenAPI definition,
  or developer portal.
